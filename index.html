<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aygun design</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:black;color:white;overflow-x:hidden;}

/* CANVAS */
canvas{
    position:fixed;
    top:0;left:0;
    z-index:-1;
}

/* CURSOR */
.cursor{
    width:20px;height:20px;
    border:2px solid gold;
    border-radius:50%;
    position:fixed;
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:9999;
}

/* HEADER */
header{
    position:fixed;width:100%;
    display:flex;justify-content:space-between;
    padding:20px 60px;
    backdrop-filter:blur(10px);
}
.logo img{
    height:70px;
    width:auto;
    display:block;
}
nav a{margin-left:25px;color:white;text-decoration:none;}

/* HERO */
.hero{
    height:100vh;
    display:flex;justify-content:center;align-items:center;
    flex-direction:column;text-align:center;
}
.hero h1{
    font-size:90px;
    background:linear-gradient(90deg,gold,#fff,gold);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
.hero p{opacity:0.7;margin-top:20px;}

/* SECTION */
.section{padding:120px 60px;}
.cards{display:flex;gap:25px;flex-wrap:wrap;justify-content:center;}

.card{
    width:260px;padding:30px;
    border:1px solid rgba(255,215,0,0.2);
    transition:0.4s;
    backdrop-filter:blur(5px);
}
.card:hover{
    transform:scale(1.1);
    box-shadow:0 0 40px rgba(255,215,0,0.5);
}

/* FOOTER */
footer{
    text-align:center;
    padding:40px;
    border-top:1px solid rgba(255,215,0,0.2);
}
</style>

</head>

<body>

<div class="cursor"></div>

<header>
<div class="logo">
  <img src="logo.png.png" alt="Aygun Design Logo">
</div>
<nav>
<a href="#">Ana Sayfa</a>
<a href="#">Hizmetler</a>
<a href="#">Projeler</a>
<a href="#">İletişim</a>
</nav>
</header>

<section class="hero">
<h1 id="title">DESIGN THE FUTURE</h1>
<p>Premium • Teknolojik • Ajans Deneyimi</p>
</section>

<section class="section">
<h2 style="color:gold;text-align:center;margin-bottom:50px;">Hizmetler</h2>
<div class="cards">
<div class="card">Grafik Tasarım</div>
<div class="card">Web Tasarım</div>
<div class="card">UI/UX</div>
<div class="card">Branding</div>
</div>
</section>

<footer>© 2026 AYGUN DESIGN</footer>

<script>

/* CUSTOM CURSOR */
const cursor=document.querySelector(".cursor");
document.addEventListener("mousemove",(e)=>{
cursor.style.top=e.clientY+"px";
cursor.style.left=e.clientX+"px";
});

/* GSAP HERO */
gsap.from("#title",{
    y:100,
    opacity:0,
    duration:1.5,
    ease:"power4.out"
});

/* PREMIUM THREE JS BACKGROUND */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  55,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 0, 34);

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

/* LIGHTS */
const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
scene.add(ambientLight);

const goldLight = new THREE.PointLight(0xffd700, 5, 150);
goldLight.position.set(12, 10, 18);
scene.add(goldLight);

const whiteLight = new THREE.PointLight(0xffffff, 2.2, 100);
whiteLight.position.set(-10, -6, 16);
scene.add(whiteLight);

/* MAIN GROUP */
const heroGroup = new THREE.Group();
scene.add(heroGroup);

/* CORE */
const coreGeometry = new THREE.IcosahedronGeometry(8.5, 1);
const coreMaterial = new THREE.MeshStandardMaterial({
  color: 0xc99a1a,
  metalness: 1,
  roughness: 0.18,
  transparent: true,
  opacity: 0.22,
  emissive: 0x3b2a00,
  emissiveIntensity: 0.9,
  side: THREE.DoubleSide
});
const core = new THREE.Mesh(coreGeometry, coreMaterial);
heroGroup.add(core);

/* OUTER WIREFRAME SHELL */
const shellGeometry = new THREE.IcosahedronGeometry(10.5, 1);
const shellMaterial = new THREE.MeshBasicMaterial({
  color: 0xffd700,
  wireframe: true,
  transparent: true,
  opacity: 0.26
});
const shell = new THREE.Mesh(shellGeometry, shellMaterial);
heroGroup.add(shell);

/* HALO RINGS */
function createRing(radius, tube, color, opacity, rotX, rotY) {
  const geometry = new THREE.TorusGeometry(radius, tube, 24, 160);
  const material = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity
  });
  const ring = new THREE.Mesh(geometry, material);
  ring.rotation.x = rotX;
  ring.rotation.y = rotY;
  heroGroup.add(ring);
  return ring;
}

const ring1 = createRing(12.8, 0.08, 0xffd700, 0.35, 0.9, 0.2);
const ring2 = createRing(14.8, 0.06, 0xffffff, 0.18, 1.9, -0.5);
const ring3 = createRing(16.8, 0.05, 0xffd700, 0.14, 0.35, 1.2);

/* SPARK PARTICLES */
function createParticles(count, minRadius, maxRadius, size, color, opacity) {
  const positions = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const radius = minRadius + Math.random() * (maxRadius - minRadius);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos((Math.random() * 2) - 1);

    positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = radius * Math.cos(phi);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

  const material = new THREE.PointsMaterial({
    color,
    size,
    transparent: true,
    opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  });

  return new THREE.Points(geometry, material);
}

const particles = createParticles(1400, 13, 22, 0.09, 0xfff2c2, 0.75);
const dust = createParticles(700, 20, 34, 0.05, 0xffffff, 0.22);

scene.add(particles);
scene.add(dust);

/* SUBTLE INTRO */
gsap.from(heroGroup.scale, {
  x: 0.72,
  y: 0.72,
  z: 0.72,
  duration: 1.8,
  ease: "power3.out"
});

gsap.from(heroGroup.rotation, {
  y: -1.1,
  duration: 1.8,
  ease: "power3.out"
});

/* MOUSE SMOOTHING */
const mouse = {
  x: 0,
  y: 0,
  tx: 0,
  ty: 0
};

document.addEventListener("mousemove", (e) => {
  mouse.tx = (e.clientX / window.innerWidth - 0.5) * 2;
  mouse.ty = (e.clientY / window.innerHeight - 0.5) * 2;
});

const clock = new THREE.Clock();

/* ANIMATION */
function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();

  mouse.x += (mouse.tx - mouse.x) * 0.04;
  mouse.y += (mouse.ty - mouse.y) * 0.04;

  heroGroup.rotation.x = 0.25 + mouse.y * 0.15 + t * 0.10;
  heroGroup.rotation.y += 0.0022;
  heroGroup.rotation.z = Math.sin(t * 0.4) * 0.08;

  heroGroup.position.x = mouse.x * 1.2;
  heroGroup.position.y = -0.4 - mouse.y * 0.9;

  core.rotation.z = t * 0.08;
  shell.rotation.z = -t * 0.06;

  ring1.rotation.z += 0.0035;
  ring2.rotation.z -= 0.0025;
  ring3.rotation.z += 0.0018;

  particles.rotation.y = t * 0.018;
  particles.rotation.x = t * 0.01;
  dust.rotation.y = -t * 0.008;

  camera.position.x += ((mouse.x * 1.4) - camera.position.x) * 0.03;
  camera.position.y += ((-mouse.y * 1.0) - camera.position.y) * 0.03;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
animate();

/* RESPONSIVE */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>

</body>
</html>
