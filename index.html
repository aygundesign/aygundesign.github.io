<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aygun design</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:black;color:white;overflow-x:hidden;}

/* CANVAS */
canvas{
    position:fixed;
    top:0;left:0;
    z-index:-1;
}

/* CURSOR */
.cursor{
    width:20px;height:20px;
    border:2px solid gold;
    border-radius:50%;
    position:fixed;
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:9999;
}

/* HEADER */
header{
    position:fixed;width:100%;
    display:flex;justify-content:space-between;
    padding:20px 60px;
    backdrop-filter:blur(10px);
}
.logo img{
    height:70px;
    width:auto;
    display:block;
}
nav a{margin-left:25px;color:white;text-decoration:none;}

/* HERO */
.hero{
    height:100vh;
    display:flex;justify-content:center;align-items:center;
    flex-direction:column;text-align:center;
}
.hero h1{
    font-size:90px;
    background:linear-gradient(90deg,gold,#fff,gold);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
.hero p{opacity:0.7;margin-top:20px;}

/* SECTION */
.section{padding:120px 60px;}
.cards{display:flex;gap:25px;flex-wrap:wrap;justify-content:center;}

.card{
    width:260px;padding:30px;
    border:1px solid rgba(255,215,0,0.2);
    transition:0.4s;
    backdrop-filter:blur(5px);
}
.card:hover{
    transform:scale(1.1);
    box-shadow:0 0 40px rgba(255,215,0,0.5);
}

/* FOOTER */
footer{
    text-align:center;
    padding:40px;
    border-top:1px solid rgba(255,215,0,0.2);
}
</style>

</head>

<body>

<div class="cursor"></div>

<header>
<div class="logo">
  <img src="logo.png.png" alt="Aygun Design Logo">
</div>
<nav>
<a href="#">Ana Sayfa</a>
<a href="#">Hizmetler</a>
<a href="#">Projeler</a>
<a href="#">İletişim</a>
</nav>
</header>

<section class="hero">
<h1 id="title">DESIGN THE FUTURE</h1>
<p>Premium • Teknolojik • Ajans Deneyimi</p>
</section>

<section class="section">
<h2 style="color:gold;text-align:center;margin-bottom:50px;">Hizmetler</h2>
<div class="cards">
<div class="card">Grafik Tasarım</div>
<div class="card">Web Tasarım</div>
<div class="card">UI/UX</div>
<div class="card">Branding</div>
</div>
</section>

<footer>© 2026 AYGUN DESIGN</footer>

<script>

/* CUSTOM CURSOR */
const cursor=document.querySelector(".cursor");
document.addEventListener("mousemove",(e)=>{
cursor.style.top=e.clientY+"px";
cursor.style.left=e.clientX+"px";
});

/* GSAP HERO */
gsap.from("#title",{
    y:100,
    opacity:0,
    duration:1.5,
    ease:"power4.out"
});

/* THREE JS BACKGROUND */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({alpha:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const geometry = new THREE.TorusKnotGeometry(10,3,100,16);
const material = new THREE.MeshBasicMaterial({color:0xffd700, wireframe:true});
const torus = new THREE.Mesh(geometry, material);

scene.add(torus);
camera.position.z = 30;

/* ANIMATION */
function animate(){
    requestAnimationFrame(animate);
    torus.rotation.x += 0.01;
    torus.rotation.y += 0.01;
    renderer.render(scene, camera);
}
animate();

/* MOUSE INTERACTION */
document.addEventListener("mousemove",(e)=>{
    torus.rotation.x = e.clientY * 0.0005;
    torus.rotation.y = e.clientX * 0.0005;
});

/* RESPONSIVE */
window.addEventListener("resize",()=>{
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
});
</script>

</body>
</html>
