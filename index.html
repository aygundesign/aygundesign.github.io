<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aygun design</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:black;color:white;overflow-x:hidden;}

/* CANVAS */
canvas{
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
}

/* CURSOR */
.cursor{
    width:20px;height:20px;
    border:2px solid gold;
    border-radius:50%;
    position:fixed;
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:9999;
}

/* HEADER */
header{
    position:fixed;width:100%;
    display:flex;justify-content:space-between;
    padding:20px 60px;
    backdrop-filter:blur(10px);
}
.logo img{
    height:70px;
    width:auto;
    display:block;
}
nav a{margin-left:25px;color:white;text-decoration:none;}

/* HERO */
.hero{
    height:100vh;
    display:flex;justify-content:center;align-items:center;
    flex-direction:column;text-align:center;
}
.hero h1{
    font-size:90px;
    background:linear-gradient(90deg,gold,#fff,gold);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
.hero p{opacity:0.7;margin-top:20px;}

/* SECTION */
.section{padding:120px 60px;}
.cards{display:flex;gap:25px;flex-wrap:wrap;justify-content:center;}

.card{
    width:260px;padding:30px;
    border:1px solid rgba(255,215,0,0.2);
    transition:0.4s;
    backdrop-filter:blur(5px);
}
.card:hover{
    transform:scale(1.1);
    box-shadow:0 0 40px rgba(255,215,0,0.5);
}

/* FOOTER */
footer{
    text-align:center;
    padding:40px;
    border-top:1px solid rgba(255,215,0,0.2);
}
</style>

</head>

<body>

<div class="cursor"></div>

<header>
<div class="logo">
  <img src="logo.png.png" alt="Aygun Design Logo">
</div>
<nav>
<a href="#">Ana Sayfa</a>
<a href="#">Hizmetler</a>
<a href="#">Projeler</a>
<a href="#">İletişim</a>
</nav>
</header>

<section class="hero">
<h1 id="title">DESIGN THE FUTURE</h1>
<p>Premium • Teknolojik • Ajans Deneyimi</p>
</section>

<section class="section">
<h2 style="color:gold;text-align:center;margin-bottom:50px;">Hizmetler</h2>
<div class="cards">
<div class="card">Grafik Tasarım</div>
<div class="card">Web Tasarım</div>
<div class="card">UI/UX</div>
<div class="card">Branding</div>
</div>
</section>

<footer>© 2026 AYGUN DESIGN</footer>

<script>

<script>
/* CUSTOM CURSOR */
const cursor = document.querySelector(".cursor");
document.addEventListener("mousemove", (e) => {
  cursor.style.top = e.clientY + "px";
  cursor.style.left = e.clientX + "px";
});

/* GSAP HERO */
gsap.from("#title", {
  y: 100,
  opacity: 0,
  duration: 1.5,
  ease: "power4.out"
});

/* PREMIUM ARTISTIC THREE BACKGROUND */
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  50,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 0, 28);

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

/* LIGHTS */
const ambient = new THREE.AmbientLight(0xffffff, 0.35);
scene.add(ambient);

const keyLight = new THREE.PointLight(0xffd36b, 4.5, 120);
keyLight.position.set(10, 8, 16);
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xffffff, 1.8, 100);
fillLight.position.set(-12, -6, 10);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xf5d27a, 2.5, 90);
rimLight.position.set(0, -10, 20);
scene.add(rimLight);

/* MAIN GROUP */
const heroGroup = new THREE.Group();
scene.add(heroGroup);

/* GLASS CORE */
const coreGeometry = new THREE.IcosahedronGeometry(5.4, 2);
const coreMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xd6a318,
  metalness: 0.15,
  roughness: 0.08,
  transmission: 0.9,
  transparent: true,
  opacity: 0.92,
  thickness: 1.2,
  clearcoat: 1,
  clearcoatRoughness: 0.08,
  emissive: 0x3a2600,
  emissiveIntensity: 0.65
});
const core = new THREE.Mesh(coreGeometry, coreMaterial);
heroGroup.add(core);

/* INNER METAL FRAME */
const frameGeometry = new THREE.IcosahedronGeometry(6.9, 1);
const frameMaterial = new THREE.MeshBasicMaterial({
  color: 0xffd700,
  wireframe: true,
  transparent: true,
  opacity: 0.18
});
const frame = new THREE.Mesh(frameGeometry, frameMaterial);
heroGroup.add(frame);

/* SCULPTURAL RIBBONS */
function makeRibbon(radius, tubeRadius, color, opacity, rotX, rotY, scaleY) {
  const geo = new THREE.TorusGeometry(radius, tubeRadius, 32, 220);
  const mat = new THREE.MeshStandardMaterial({
    color,
    metalness: 1,
    roughness: 0.18,
    transparent: true,
    opacity,
    emissive: color,
    emissiveIntensity: 0.12
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = rotX;
  mesh.rotation.y = rotY;
  mesh.scale.y = scaleY;
  heroGroup.add(mesh);
  return mesh;
}

const ribbon1 = makeRibbon(8.8, 0.13, 0xd4a017, 0.95, 0.5, 0.2, 0.72);
const ribbon2 = makeRibbon(10.8, 0.09, 0xffffff, 0.25, 1.4, -0.4, 0.58);
const ribbon3 = makeRibbon(12.8, 0.08, 0xf0c85a, 0.24, 2.1, 0.8, 0.48);
const ribbon4 = makeRibbon(14.2, 0.05, 0xffffff, 0.12, 0.9, 1.2, 0.42);

/* PARTICLES */
function createParticles(count, minRadius, maxRadius, size, color, opacity) {
  const positions = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const radius = minRadius + Math.random() * (maxRadius - minRadius);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos((Math.random() * 2) - 1);

    positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = radius * Math.cos(phi);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

  const material = new THREE.PointsMaterial({
    color,
    size,
    transparent: true,
    opacity,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true
  });

  return new THREE.Points(geometry, material);
}

const particlesGold = createParticles(1200, 10, 19, 0.07, 0xffe19a, 0.8);
const particlesSoft = createParticles(700, 16, 28, 0.04, 0xffffff, 0.22);
scene.add(particlesGold);
scene.add(particlesSoft);

/* BACKGROUND GLOW RINGS */
function createHalo(radius, opacity, color, z) {
  const geo = new THREE.RingGeometry(radius, radius + 0.15, 128);
  const mat = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity,
    side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.z = z;
  scene.add(mesh);
  return mesh;
}

const halo1 = createHalo(9.5, 0.06, 0xffd36b, -6);
const halo2 = createHalo(14.5, 0.03, 0xffffff, -8);

/* INTRO */
gsap.from(heroGroup.scale, {
  x: 0.65,
  y: 0.65,
  z: 0.65,
  duration: 1.8,
  ease: "power3.out"
});

gsap.from(heroGroup.rotation, {
  y: -1,
  duration: 1.8,
  ease: "power3.out"
});

/* MOUSE */
const mouse = {
  x: 0,
  y: 0,
  tx: 0,
  ty: 0
};

document.addEventListener("mousemove", (e) => {
  mouse.tx = (e.clientX / window.innerWidth - 0.5) * 2;
  mouse.ty = (e.clientY / window.innerHeight - 0.5) * 2;
});

const clock = new THREE.Clock();

/* ANIMATION */
function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();

  mouse.x += (mouse.tx - mouse.x) * 0.03;
  mouse.y += (mouse.ty - mouse.y) * 0.03;

  heroGroup.rotation.x = 0.18 + mouse.y * 0.18 + Math.sin(t * 0.55) * 0.04;
  heroGroup.rotation.y += 0.0035;
  heroGroup.rotation.z = Math.sin(t * 0.35) * 0.06;

  heroGroup.position.x = mouse.x * 1.5;
  heroGroup.position.y = -0.3 - mouse.y * 1.1;

  core.rotation.x += 0.002;
  core.rotation.y -= 0.0025;

  frame.rotation.x -= 0.0016;
  frame.rotation.y += 0.0018;

  ribbon1.rotation.z += 0.006;
  ribbon2.rotation.z -= 0.004;
  ribbon3.rotation.z += 0.0025;
  ribbon4.rotation.z -= 0.0018;

  particlesGold.rotation.y = t * 0.02;
  particlesGold.rotation.x = t * 0.008;
  particlesSoft.rotation.y = -t * 0.006;

  halo1.rotation.z = t * 0.04;
  halo2.rotation.z = -t * 0.025;

  camera.position.x += ((mouse.x * 1.2) - camera.position.x) * 0.025;
  camera.position.y += ((-mouse.y * 0.8) - camera.position.y) * 0.025;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
animate();

/* RESPONSIVE */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>

</body>
</html>
